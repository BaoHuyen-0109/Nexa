<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>NEXA - Smart User Platform</title>
    <style id="expo-reset">
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #1E164B;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Preloader Nexa */
      .nexa-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        background-color: #1E164B;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .nexa-logo-badge {
        width: 60px;
        height: 60px;
        border-radius: 18px;
        background: linear-gradient(135deg, #635BFF 0%, #8B5CF6 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #FFFFFF;
        font-size: 28px;
        font-weight: 800;
        box-shadow: 0 10px 25px rgba(99, 91, 255, 0.4);
        margin-bottom: 16px;
      }
      .nexa-title {
        color: #FFFFFF;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1.5px;
        margin-bottom: 6px;
      }
      .nexa-subtitle {
        color: #C4B5FD;
        font-size: 13px;
        margin-bottom: 24px;
        letter-spacing: 0.5px;
      }
      .nexa-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #A78BFA;
        border-radius: 50%;
        animation: nexa-spin 0.75s linear infinite;
      }
      @keyframes nexa-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <link rel="icon" href="/favicon.ico"/>
  </head>

  <body>
    <noscript>Vui lòng kích hoạt JavaScript để chạy ứng dụng Nexa.</noscript>
    <div id="root">
      <div class="nexa-preloader">
        <div class="nexa-logo-badge">N</div>
        <div class="nexa-title">NEXA</div>
        <div class="nexa-subtitle">Đang khởi động nền tảng Nexa...</div>
        <div class="nexa-spinner"></div>
      </div>
    </div>
  </body>
</html>
